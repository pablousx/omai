name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omai-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  native:
    # Use a dedicated account or an ephemeral runner with the host home inaccessible.
    # Never route untrusted pull requests to this runner.
    if: github.repository == 'pablousx/omai' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux, X64, omarchy, omai-release]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate exact tagged plugin with native host
        run: |
          omarchy version
          omarchy plugin validate .
          python3 scripts/test-qml.py --screenshots build/native-preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-preview
          path: build/native-preview/*.png
          if-no-files-found: error
  draft:
    needs: [checks, native]
    if: github.repository == 'pablousx/omai' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: toolchain
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("mise.toml", "rb"))["tools"]["go"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: true
      - name: Package exact version
        run: python3 scripts/package-release.py --tag "$GITHUB_REF_NAME"
      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "omai $GITHUB_REF_NAME" --notes-file docs/release-notes.md build/release/*.tar.gz build/release/SHA256SUMS LICENSE
