name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: toolchain
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("mise.toml", "rb"))["tools"]["go"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -config-file .github/actionlint.yaml .github/workflows/*.yml
      - name: Regression and installation checks
        run: scripts/check
      - name: Generated systemd unit
        run: python3 scripts/test-install.py build/omai --verify-unit
      - name: Reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build and verify release archives
        run: |
          python3 scripts/package-release.py
          mkdir -p build/verified
          cp build/release/*.tar.gz build/release/SHA256SUMS build/verified/
          python3 scripts/verify-release.py build/verified "omai_$(build/omai version)_linux_amd64.tar.gz"
          chmod 700 build/verified/omai
          python3 scripts/check-release.py --binary build/verified/omai
          python3 scripts/test-e2e.py build/verified/omai
